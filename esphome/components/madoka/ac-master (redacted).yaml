select:
  - platform: template
    name: "Living Room - Fan Speed"
    id: living_room_ac_fan_mode_select
    web_server:
      sorting_group_id: sorting_group_living_room_ac
      sorting_weight: 12
    options:
      - "HIGH"
      - "LOW"
    set_action:
      - if:
          condition:
            lambda: 'return x == "HIGH";'
          then:
            - climate.control:
                id: living_room_ac_climate
                fan_mode: HIGH
      - if:
          condition:
            lambda: 'return x == "LOW";'
          then:
            - climate.control:
                id: living_room_ac_climate
                fan_mode: LOW

  - platform: template
    name: "Master Bedroom - Fan Speed"
