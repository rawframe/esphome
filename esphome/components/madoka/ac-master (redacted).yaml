climate:
  - platform: madoka
    id: living_room_ac_climate
    name: "Living Room"
    web_server:
      sorting_group_id: sorting_group_living_room_ac
      sorting_weight: 11
    ble_client_id: living_room_ac
    update_interval: 15s
    on_state:
      - lambda: |-
          auto fan_mode = x.fan_mode;
          auto select_option = id(living_room_ac_fan_mode_select).state;
          if ((fan_mode == esphome::climate::ClimateFanMode::CLIMATE_FAN_HIGH && select_option != "HIGH") ||
              (fan_mode == esphome::climate::ClimateFanMode::CLIMATE_FAN_LOW && select_option != "LOW")) {
            id(living_room_ac_fan_mode_select).publish_state(fan_mode == esphome::climate::ClimateFanMode::CLIMATE_FAN_HIGH ? "HIGH" : "LOW");
          }
      - script.execute: flash_green_script

  - platform: madoka
    id: master_bedroom_ac_climate
    name: "Master Bedroom"
    web_server:
      sorting_group_id: sorting_group_master_bedroom_ac
      sorting_weight: 21
    ble_client_id: master_bedroom_ac
    update_interval: 15s
    on_state:
      - lambda: |-
          auto fan_mode = x.fan_mode;
          auto select_option = id(master_bedroom_ac_fan_mode_select).state;
          if ((fan_mode == esphome::climate::ClimateFanMode::CLIMATE_FAN_HIGH && select_option != "HIGH") ||
              (fan_mode == esphome::climate::ClimateFanMode::CLIMATE_FAN_LOW && select_option != "LOW")) {
            id(master_bedroom_ac_fan_mode_select).publish_state(fan_mode == esphome::climate::ClimateFanMode::CLIMATE_FAN_HIGH ? "HIGH" : "LOW");
          }
      - script.execute: flash_green_script

