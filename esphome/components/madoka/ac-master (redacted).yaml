esphome:
  name: ac-master
  # comment: Living Room, Master Bedroom
  friendly_name: AC (MASTER UNITS)
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"  
    board_build.flash_mode: dio
    board_build.f_flash: 40000000L
    board_build.flash_size: 4MB

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  framework:
    type: esp-idf
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: "y"

psram:
  # mode: quad
  # speed: 80MHz

# Enable logging
logger:
  level: ERROR

# Enable Home Assistant API
api:
  encryption:
    key: "XXXXXXXX"
  # reboot_timeout: 0s
  # password: ""

ota:
  platform: esphome
  password: "XXXXXXXX"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "XXXXXXXX"
    password: "XXXXXXXX"

captive_portal:

web_server:
  port: 80
  version: 3
  log: true
  css_include: "webserver-v1.min.css"
#   js_url: "https://esphome.io/_static/webserver-v1.min.js"
  js_include: "ac-master-custom.js"
#   local: true
  include_internal: false
  sorting_groups:
    - id: sorting_group_living_room_ac
      name: "Living Room (Group 1 Master)"
      sorting_weight: 10
    - id: sorting_group_master_bedroom_ac
      name: "Master Bedroom (Group 2 Master)"
      sorting_weight: 20
    # - id: sorting_group_guest_bedroom_ac
    #   name: "Guest Bedroom (Group 2 Slave)"
    #   sorting_weight: 30
    # - id: sorting_group_study_ac
    #   name: "Study (Group 2 Slave)"
    #   sorting_weight: 40
    - id: sorting_group_madoka
      name: "Madoka Wi-fi Bridge (Master controllers)"
      sorting_weight: 100

light:
  - platform: esp32_rmt_led_strip
    id: led_rgb_onboard
    name: "on board light"
    rgb_order: GRB
    pin: GPIO21
    num_leds: 1
    rmt_channel: 0
    chipset: ws2812
    use_psram: true
    default_transition_length: 0s
    internal: true

external_components:
  - source: github://rawframe/esphome@madoka
    components: [ madoka ]

esp32_ble_tracker:

esp32_ble:
  io_capability: display_yes_no

ble_client:
  - mac_address: XXXXXXXX
    id: living_room_ac
    on_connect:
      then:
        - logger.log:
            format: "Living Room AC Connected"
            level: INFO
        - script.execute: connection_status_light_script
    on_disconnect:
      then:
        - logger.log:
            format: "Living Room AC Disconnected"
            level: ERROR
        - script.execute: connection_status_light_script

  - mac_address: XXXXXXXX
    id: master_bedroom_ac
    on_connect:
      then:
        - logger.log:
            format: "Master Bedroom AC Connected"
            level: INFO
        - script.execute: connection_status_light_script
    on_disconnect:
      then:
        - logger.log:
            format: "Master Bedroom AC Disconnected"
            level: ERROR
        - script.execute: connection_status_light_script

