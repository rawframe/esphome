script: 
  - id: connection_status_light_script # blue = all controllers connected, amber=some controllers disconnected, red=all controllers disconnected
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(living_room_ac).connected();'
              - lambda: 'return id(master_bedroom_ac).connected();'
          then:
            - logger.log:
                format: "All Madoka controllers connected."
                level: INFO
            - light.turn_on:
                id: led_rgb_onboard
                brightness: 11%
                color_mode: RGB
                red: 0%
                green: 0%
                blue: 100%
          else:
            - if:
                condition:
                  or:
                    - lambda: 'return id(living_room_ac).connected();'
                    - lambda: 'return id(master_bedroom_ac).connected();'
                then:
                  - logger.log:
                      format: "One or more Madoka controllers disconnected."
                      level: ERROR
                  - light.turn_on:
                      id: led_rgb_onboard
                      brightness: 16%
                      color_mode: RGB
                      red: 100%
                      green: 75%
                      blue: 0%
                else:
                  - logger.log: 
                      format: "All Madoka controllers disconnected."
                      level: ERROR
                  - light.turn_on:
                      id: led_rgb_onboard
                      brightness: 12%
                      color_mode: RGB
                      red: 100%
                      green: 0%
                      blue: 0%
                  
  - id: flash_green_script # green = status change data sent or recieved
    mode: parallel
    max_runs: 3
    then:
      - script.wait: flash_purple_script
      - light.turn_on:
          id: led_rgb_onboard
          flash_length: 25ms
          brightness: 11%
          color_mode: RGB
          red: 0%
          green: 100%
          blue: 0%
      - delay: 25ms
      - script.execute: connection_status_light_script

  - id: flash_purple_script #purple = dismiss clean filter notification sent   
    then:
      - light.turn_on:
          id: led_rgb_onboard
          flash_length: 500ms
          brightness: 20%
          color_mode: RGB
          red: 63%
          green: 13%
          blue: 94%
      - delay: 500ms
      - script.execute: connection_status_light_script

button:
  - platform: restart
    name: "Restart"
    id: restart_wifi_master_controller
    web_server:
      sorting_group_id: sorting_group_madoka
      sorting_weight: 102

  - platform: shutdown
    name: "Shutdown"
    id: shutdown_wifi_master_controller
    web_server:
      sorting_group_id: sorting_group_madoka
      sorting_weight: 103

  - platform: template
    name: "Living Room - Dismiss Clean Filter Notification"
    web_server:
      sorting_group_id: sorting_group_living_room_ac
      sorting_weight: 13
    on_press:
      - lambda: |-
          id(living_room_ac_climate).disable_clean_filter_indicator();
      - script.execute: flash_purple_script

  - platform: template
    name: "Master Bedroom - Dismiss Clean Filter Notification"
    web_server:
      sorting_group_id: sorting_group_master_bedroom_ac
      sorting_weight: 23
    on_press:
      - lambda: |-
          id(master_bedroom_ac_climate).disable_clean_filter_indicator();
      - script.execute: flash_purple_script

